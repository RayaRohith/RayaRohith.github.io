<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Raya Rohith Yadav, MSc Cyber Security Graduate, Independent Security Researcher, AI Training Consultant. Edinburgh, UK." />
  <title>Raya Rohith Yadav</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0A0E1A; --surface: #111827; --surface2: #161F30;
      --border: #1E2D40; --cyan: #00D4FF; --purple: #7C3AED;
      --cyan-dim: rgba(0,212,255,0.10); --text: #E2E8F0; --muted: #64748B;
      --mono: 'JetBrains Mono', monospace; --sans: 'Inter', sans-serif;
    }
    html { scroll-behavior: smooth; }
    body { background: var(--bg); color: var(--text); font-family: var(--sans); font-size: 15px; line-height: 1.7; -webkit-font-smoothing: antialiased; }
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--cyan); border-radius: 2px; }

    /* NAV */
    nav { position: fixed; top: 0; left: 0; right: 0; z-index: 100; background: rgba(10,14,26,0.95); backdrop-filter: blur(12px); border-bottom: 1px solid var(--border); padding: 0 2rem; height: 56px; display: flex; align-items: center; justify-content: space-between; }
    .nav-logo { font-family: var(--mono); font-size: 14px; color: var(--cyan); letter-spacing: 0.05em; }
    .nav-logo span { color: var(--muted); }
    .nav-links { display: flex; gap: 1.5rem; list-style: none; }
    .nav-links a { font-family: var(--mono); font-size: 12px; color: var(--muted); text-decoration: none; letter-spacing: 0.05em; transition: color 0.2s; }
    .nav-links a:hover { color: var(--cyan); }

    /* HERO */
    #hero { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 80px 2rem 4rem; position: relative; overflow: hidden; }
    .hero-grid { position: absolute; inset: 0; background-image: linear-gradient(var(--border) 1px, transparent 1px), linear-gradient(90deg, var(--border) 1px, transparent 1px); background-size: 48px 48px; opacity: 0.3; mask-image: radial-gradient(ellipse 80% 80% at 50% 50%, black 40%, transparent 100%); }
    .hero-inner { position: relative; z-index: 1; max-width: 900px; width: 100%; display: grid; grid-template-columns: 1fr 260px; gap: 3rem; align-items: center; }
    .hero-text { }
    .hero-eyebrow { font-family: var(--mono); font-size: 12px; color: var(--cyan); letter-spacing: 0.15em; text-transform: uppercase; margin-bottom: 1.25rem; display: flex; align-items: center; gap: 0.75rem; }
    .hero-eyebrow::before { content: ''; display: inline-block; width: 24px; height: 1px; background: var(--cyan); }
    h1 { font-family: var(--mono); font-size: clamp(1.8rem, 4vw, 2.8rem); font-weight: 700; line-height: 1.2; color: var(--text); margin-bottom: 0.5rem; }
    .cursor { display: inline-block; width: 3px; height: 0.9em; background: var(--cyan); margin-left: 4px; vertical-align: middle; animation: blink 1s step-end infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    .hero-sub { font-family: var(--mono); font-size: 13px; color: var(--cyan); margin-bottom: 1.25rem; letter-spacing: 0.05em; }
